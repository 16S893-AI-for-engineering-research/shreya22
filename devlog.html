<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Log — Shreya Sharma</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h1>Dev Log</h1>
    <p class="lede">
      Two-column running log: the left column is what I asked the
      <code>pi</code> coding agent to do and what it generated; the right
      column is my own notes on what actually happened, what I checked,
      and what I would change. Newest entries first.
    </p>

    <div id="devlog-entries"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script>
    (async function () {
      const container = document.getElementById("devlog-entries");
      try {
        const res = await fetch("data/devlog.json");
        const entries = await res.json();
        entries
          .slice()
          .reverse()
          .forEach((entry) => {
            const card = document.createElement("div");
            card.className = "card devlog-entry";
            const agentLog = entry.agentLog || entry.body || "";
            const yourNotes = entry.yourNotes || "";
            card.innerHTML =
              "<h3>" + entry.title + "</h3>" +
              "<div class='meta'>" + entry.date + "</div>" +
              "<div class='devlog-columns'>" +
                "<div class='devlog-col'>" +
                  "<div class='devlog-col__label'>Agent log</div>" +
                  "<p>" + agentLog + "</p>" +
                "</div>" +
                "<div class='devlog-col'>" +
                  "<div class='devlog-col__label'>My notes</div>" +
                  "<p>" + (yourNotes || "<em>Add your notes here.</em>") + "</p>" +
                "</div>" +
              "</div>";
            container.appendChild(card);
          });
      } catch (err) {
        container.innerHTML = "<p>Could not load dev log entries.</p>";
      }
    })();
  </script>
</body>
</html>
