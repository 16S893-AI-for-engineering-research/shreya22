<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shreya Sharma — Sustainable Aviation Portfolio</title>
  <meta
    name="description"
    content="Portfolio of Shreya Sharma, MIT 16.S893 — sustainable aviation research."
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="wide">
    <section class="hero">
      <div class="hero-text">
        <h1>Sustainable Aviation, Mapped</h1>
        <p class="lede" style="margin: 0 auto;">
          Watching a global flight network come to life, route by route —
          and what happens when we look closer at what each flight leaves
          behind.
        </p>
      </div>
      <div id="map-container" class="map-wrap" aria-label="Animated flight map"></div>
    </section>

    <section style="max-width: 700px; margin: 40px auto 0; text-align: center;">
      <p style="font-size: 13px; color: var(--ink-soft);">
        Tip: the map is quietly interactive. Not every flight is just a
        flight.
      </p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/map.js"></script>
  <script src="js/egg.js"></script>
</body>
</html>
