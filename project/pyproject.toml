[project]
name = "network-airquality"
version = "0.1.0"
description = "Hub-and-spoke vs point-to-point network comparison: demand, routing, fuel and emissions (16.S893 project)"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7,<3.11",
    "openap>=2.6.2",
    "pytest>=7,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
